<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img">
  <defs>
    <linearGradient id="fondo" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#fbf5e3"/>
      <stop offset="1" stop-color="#f4e8c2"/>
    </linearGradient>
    <radialGradient id="luz" cx="0.32" cy="0.22" r="0.85">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="grano" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="7"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <filter id="difumina" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
  </defs>
  <rect width="800" height="500" fill="url(#fondo)"/>
  <rect width="800" height="500" fill="url(#luz)"/>
  <ellipse cx="474.8" cy="404" rx="178" ry="22" fill="#073b4f" opacity="0.16" filter="url(#difumina)"/>
  <!-- bolsa de papel -->
  <g>
    <path d="M286 244h228l-20 158H306z" fill="#e2683f" opacity="0.85"/>
    <path d="M286 244h228l-6 30H292z" fill="#d4a017"/>
    <path d="M336 244c0-34 26-56 64-56s64 22 64 56" fill="none" stroke="#073b4f" stroke-width="11" opacity="0.75"/>
  </g>
  <!-- etiqueta colgante -->
  <g transform="rotate(-14 596 300)">
    <rect x="556" y="248" width="84" height="112" rx="12" fill="#faf6ee" stroke="#1b7f9e" stroke-width="5"/>
    <circle cx="598" cy="272" r="9" fill="#1b7f9e"/>
    <path d="M574 300h48M574 320h34" stroke="#073b4f" stroke-width="6" opacity="0.4" stroke-linecap="round"/>
  </g>
  <circle cx="204" cy="212" r="26" fill="#1b7f9e" opacity="0.3"/>
  <circle cx="212" cy="330" r="14" fill="#1b7f9e" opacity="0.2"/>
  <rect width="800" height="500" filter="url(#grano)" opacity="0.055" style="mix-blend-mode:multiply"/>
</svg>
