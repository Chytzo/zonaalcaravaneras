<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img">
  <defs>
    <linearGradient id="fondo" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#fceef6"/>
      <stop offset="1" stop-color="#f6dcec"/>
    </linearGradient>
    <radialGradient id="luz" cx="0.32" cy="0.22" r="0.85">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="grano" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="7"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <filter id="difumina" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
  </defs>
  <rect width="800" height="500" fill="url(#fondo)"/>
  <rect width="800" height="500" fill="url(#luz)"/>
  <ellipse cx="464.9" cy="400" rx="164" ry="22" fill="#073b4f" opacity="0.16" filter="url(#difumina)"/>
  <!-- pintalabios -->
  <g>
    <rect x="252" y="266" width="60" height="132" rx="12" fill="#073b4f"/>
    <rect x="252" y="252" width="60" height="26" rx="8" fill="#d4a017"/>
    <path d="M262 252v-46l40-12v58z" fill="#e2683f"/>
  </g>
  <!-- espejo de mano -->
  <g>
    <circle cx="430" cy="286" r="86" fill="#faf6ee" stroke="#d4a017" stroke-width="10"/>
    <circle cx="430" cy="286" r="66" fill="#dcf0f6" opacity="0.75"/>
    <rect x="418" y="368" width="24" height="70" rx="12" fill="#d4a017"/>
  </g>
  <!-- polvera -->
  <g>
    <circle cx="580" cy="356" r="44" fill="#e2683f" opacity="0.85"/>
    <circle cx="580" cy="356" r="26" fill="#faf6ee" opacity="0.55"/>
    <path d="M556 300c0-14 12-24 24-24s24 10 24 24" fill="none" stroke="#16232a" stroke-width="6" opacity="0.5"/>
  </g>
  <circle cx="206" cy="200" r="12" fill="#1b7f9e" opacity="0.5"/>
  <circle cx="238" cy="170" r="7" fill="#1b7f9e" opacity="0.35"/>
  <rect width="800" height="500" filter="url(#grano)" opacity="0.055" style="mix-blend-mode:multiply"/>
</svg>
